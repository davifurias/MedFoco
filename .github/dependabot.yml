version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      dependencias-de-desenvolvimento:
        dependency-type: development
    ignore:
      # O typescript-eslint ainda não suporta o TypeScript 7 (o lint falha). Rever quando suportar.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
