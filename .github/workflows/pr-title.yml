# O título do PR vira o commit na main (squash merge), então ele precisa seguir
# o padrão Conventional Commits. Ex.: "feat: adiciona metas semanais".
name: Título do PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  titulo:
    name: Título no padrão Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: 'Comece a descrição com letra minúscula. Ex.: "feat: adiciona metas semanais".'
