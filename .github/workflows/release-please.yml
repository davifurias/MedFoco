# Mantém aberto um PR "chore(main): release X.Y.Z" com o CHANGELOG.
# Ao incorporar esse PR, a tag vX.Y.Z e a Release do GitHub são criadas.
# Ver docs/releases.md.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # Com um token pessoal, o CI também roda no PR de release (ver docs/releases.md).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
